name            = "nonprofit-data"
main            = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding  = "DB"
database_name = "nonprofit-990"
database_id   = "182e0e14-faac-42db-97de-f6e2ac5960ee"

# ─── Secrets (set with: wrangler secret put ADMIN_KEY) ───────────────────────
# ADMIN_KEY — protects the POST /api/sync route
# LOGO_DEV_SECRET_KEY — optional sk_… for POST /api/logo-cache-warm (Brand Search → D1 org_logo_cache)
# LOGO_DEV_PUBLISHABLE_KEY — optional pk_… so GET /api/irs990-browse adds logo_image_url (img.logo.dev) without exposing the key to Vercel

# ─── Routes (set your zone after deploying) ──────────────────────────────────
# [[routes]]
# pattern = "nonprofit-data.loganngarcia.com/*"
# zone_name = "loganngarcia.com"

[vars]
PORTFOLIO_EINS = "330103012,680073413,371437781"   # comma-sep 9-digit EINs
