[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moobu-api"
version = "0.1.0"
description = "Moobu nonprofit financial resilience API"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
