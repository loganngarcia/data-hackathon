# Deploy Next.js app to Vercel whenever `app/` changes (main/master).
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens (same as local `app/.env.local`)
#   VERCEL_ORG_ID       — Project → Settings → General → "Team ID" / org id
#   VERCEL_PROJECT_ID   — Project → Settings → General → "Project ID"
#
# Without these, use local `npm run deploy:vercel` from `app/` (loads `.env.local`).
name: Deploy Vercel (app)

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/deploy-vercel-app.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy production + alias vanity URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID. Add them under repo Actions secrets." >&2
            exit 1
          fi
          SCOPE="loganngarcias-projects"
          VANITY="nonprofit-ai-data.vercel.app"
          PROD_SLOT="app-sigma-lilac-76.vercel.app"
          npx vercel@50.23.1 deploy --prod --yes --token "$VERCEL_TOKEN"
          npx vercel@50.23.1 alias set "$PROD_SLOT" "$VANITY" --token "$VERCEL_TOKEN" -S "$SCOPE"
