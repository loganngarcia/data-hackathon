# Deploy nonprofit-data Worker whenever its sources change (main/master).
# Repo secret: CLOUDFLARE_API_TOKEN — create at https://dash.cloudflare.com/profile/api-tokens
# (template: "Edit Cloudflare Workers" or custom: Account + Workers Scripts:Edit for the account).
name: Deploy Cloudflare Worker (nonprofit-data)

on:
  push:
    branches: [main, master]
    paths:
      - "workers/nonprofit-data/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: workers/nonprofit-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/nonprofit-data/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
